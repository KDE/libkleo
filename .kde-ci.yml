Dependencies:
 - 'on': ['Linux', 'FreeBSD', 'Windows']
   'require':
    'frameworks/extra-cmake-modules': 'Frameworks/6.24'
    'frameworks/ki18n': 'Frameworks/6.24'
    'frameworks/kconfig': 'Frameworks/6.24'
    'frameworks/kcolorscheme': 'Frameworks/6.24'
    'frameworks/kwidgetsaddons': 'Frameworks/6.24'
    'frameworks/kcompletion': 'Frameworks/6.24'
    'frameworks/kcoreaddons': 'Frameworks/6.24'
    'frameworks/kcodecs': 'Frameworks/6.24'
    'frameworks/kitemmodels': 'Frameworks/6.24'
    'libraries/ktextaddons': '@latest-kf6'

Options:
 # keyresolvercoretest sometimes takes very long on FreeBSD
 per-test-timeout: 120
 allow-failing-tests-on: ['Windows']
 require-passing-tests-on: ['Linux', 'FreeBSD']
 cppcheck-arguments:
  - '--enable=warning,style,performance'
  - '--suppress-xml=cppcheck-suppressions.xml'
